plugins {
    id 'java'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    implementation 'org.apache.spark:spark-core_2.12:3.4.1'
    implementation 'org.apache.spark:spark-sql_2.12:3.4.1'
    implementation 'org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1'

    implementation 'org.scala-lang:scala-library:2.12.17'

    implementation 'org.fasterxml.jackson.core:jackson-databind:2.15.8'
    implementation 'org.fasterxml.jackson.core:jackson-core:2.15.0'
    implementation 'org.fasterxml.jackson.core:jackson-annotations:2.15.0'

    compileOnly 'org.projectlombok:lombok:1.18.26'
    annotationProcessor 'org.projectlombok:lombok:1.18.26'

    implementation 'org.neo4j:neo4j-connector-apache-spark_2.12:5.3.2_for_spark_3'
}

test {
    useJUnitPlatform()
}